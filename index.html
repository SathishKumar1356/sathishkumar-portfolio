<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050816" />
    <meta name="description" content="OutSystems software developer portfolio — enterprise applications, integrations, automation and AI-enabled experiences." />
    <title>Software Developer | OutSystems</title>

    <!-- Fonts load without blocking the first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    </noscript>

    <!-- Shown instantly, before any JavaScript has loaded; React replaces it -->
    <style>
      html, body { margin: 0; background: #050713; }
      .boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 18px; color: #cdd5f3; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: radial-gradient(ellipse at 50% 40%, rgba(109, 76, 255, .22), transparent 60%), #050713; }
      .boot-orb { width: 54px; height: 54px; border-radius: 50%; border: 3px solid rgba(151, 132, 255, .25); border-top-color: #a48aff; animation: boot-spin .9s linear infinite; }
      .boot p { margin: 0; font-size: 14px; letter-spacing: .4px; }
      .boot strong { display: block; text-align: center; color: #fff; font-size: 20px; margin-bottom: 4px; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-orb"></div>
        <p><strong>Sathish Kumar</strong>OutSystems Technical Lead · loading portfolio…</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
